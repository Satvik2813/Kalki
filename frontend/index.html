<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KALKI — Autonomous AI Software Engineer</title>
  
  <!-- Google Fonts: Inter, JetBrains Mono, Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- CSS Styles -->
  <link rel="stylesheet" href="css/kalki-theme.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>
  
  <!-- View Container -->
  <div id="app-container">
    <!-- Onboarding Overlay (Login -> Project -> Objective) -->
    <div id="onboarding-overlay" class="onboarding-overlay">
      <div id="onboarding-content"></div>
    </div>

    <!-- Header Component Target -->
    <div id="header-target"></div>

    <!-- Stage Pipeline Ribbon Component Target -->
    <div id="stage-target"></div>

    <!-- 3. PROJECT SELECTION VIEW -->
    <section id="project-view" class="view-section hidden">
      <div class="project-card glass-panel">
        <h2>Select Project</h2>
        <p class="text-muted mb-4">Choose your target engineering environment.</p>
        
        <div class="project-options">
          <div class="project-option" id="opt-github">
            <h3>GitHub Repository</h3>
            <p class="text-muted">Remote PR workflow</p>
          </div>
          <div class="project-option" id="opt-vercel">
            <h3>Vercel Project</h3>
            <p class="text-muted">Cloud deployment</p>
          </div>
          <div class="project-option" id="opt-local">
            <h3>Local Workspace</h3>
            <p class="text-muted">Filesystem access</p>
          </div>
        </div>

        <div class="mt-4 flex-between">
          <button class="btn" id="btn-back-auth">Back</button>
          <button class="btn btn-accent" id="btn-confirm-project" disabled>Confirm Environment</button>
        </div>
      </div>
    </section>

    <!-- 4. MAIN WORKSPACE VIEW -->
    <section id="workspace-view" class="view-section hidden">
      
      <!-- Header Component Target -->
      <div id="header-target"></div>

      <!-- Objective Input Component Target -->
      <div id="objective-target"></div>

      <!-- Stage Pipeline Ribbon Component Target -->
      <div id="stage-target"></div>

      <!-- Main Workspace (Split View) -->
      <main class="workspace-grid">
        <!-- Left HERO: Live Execution Timeline -->
        <section id="timeline-target" class="timeline-panel glass-panel"></section>

        <!-- Right Work Area: Tabbed Control Center -->
        <section class="control-tabs-panel glass-panel">
          <nav class="tabs-header">
            <button class="tab-btn active" data-tab="tab-plan">PLAN</button>
            <button class="tab-btn" data-tab="tab-tools">TOOLS</button>
            <button class="tab-btn" data-tab="tab-memory">MEMORY</button>
            <button class="tab-btn" data-tab="tab-recovery">RECOVERY</button>
            <button class="tab-btn" data-tab="tab-code">CODE DIFF</button>
            <button class="tab-btn" data-tab="tab-tests">TESTS</button>
            <button class="tab-btn" data-tab="tab-deploy">DEPLOYMENT</button>
          </nav>

          <div class="tab-content-area">
            <div id="tab-plan" class="tab-pane active"></div>
            <div id="tab-tools" class="tab-pane"></div>
            <div id="tab-memory" class="tab-pane"></div>
            <div id="tab-recovery" class="tab-pane"></div>
            <div id="tab-code" class="tab-pane"></div>
            <div id="tab-tests" class="tab-pane"></div>
            <div id="tab-deploy" class="tab-pane"></div>
          </div>
        </section>
      </main>
    </section>

  </div>

  <!-- Entry Script -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
